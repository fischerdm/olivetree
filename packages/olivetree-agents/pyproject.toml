[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olivetree-agents"
version = "0.0.1"
description = "Agentic components for life insurance pricing, built on olivetree tools."
readme = "README.md"
license = "MIT"
authors = [
    { name = "David Fischer", email = "fischerdm1@outlook.com" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

# 'olivetree' is a PEP 420 namespace package: src/olivetree/ has no __init__.py.
[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/olivetree"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
