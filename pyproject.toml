[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olivetree"
version = "0.0.1"
description = "Agentic AI for life insurance pricing."
readme = "README.md"
license = "MIT"
authors = [
    { name = "David Fischer", email = "fischerdm1@outlook.com" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "olivetree-tools>=0.0.1",
    "olivetree-agents>=0.0.1",
    "olivetree-mcp>=0.0.1",
    "olivetree-servers>=0.0.1",
]

# Meta-package: ships no code of its own. The 'olivetree' namespace is
# provided by the sub-packages under packages/ (PEP 420, no __init__.py).
[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
bypass-selection = true

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
only-include = ["README.md", "LICENSE"]
